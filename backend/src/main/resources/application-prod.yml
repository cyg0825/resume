# =====================================================================
# 生产环境配置
# 仅写与本地默认配置的差异项，其余继承 application.yml。
# 启动方式（二选一）：
#   1) 环境变量：SPRING_PROFILES_ACTIVE=prod
#   2) 启动参数：java -jar resume-backend.jar --spring.profiles.active=prod
# 零参数启动（默认即 prod）：
#   nohup java -jar resume-backend.jar > resume.log 2>&1 &
# =====================================================================
spring:
  datasource:
    url: jdbc:h2:file:${H2_DATA_DIR:./data/resume};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER;INIT=RUNSCRIPT FROM 'classpath:schema.sql'\;RUNSCRIPT FROM 'classpath:data.sql'
    username: ${H2_USER:sa}
    password: ${H2_PASSWORD:}

app:
  # 上传文件目录，与 Nginx 的 /uploads/ 反代对应
  upload:
    dir: ${UPLOAD_DIR:./uploads}

# 生产环境关闭接口文档，避免对外暴露
knife4j:
  production: ${KNIFE4J_PRODUCTION:true}

logging:
  level:
    # 生产只打印 info 级别，需要排查时设 LOG_LEVEL=debug
    com.example.resume: ${LOG_LEVEL:info}