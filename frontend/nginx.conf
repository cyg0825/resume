server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # 上传文件大小（与后端 spring.servlet.multipart.max-request-size 保持一致）
    client_max_body_size 12m;

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反向代理
    # 读超时对齐前端 AI 导入请求的 180s，否则大 PDF 导入会先被这一层断开
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 上传的图片等静态资源
    # ^~ 让前缀匹配优先于下面的正则 location，否则 /uploads/x.jpg 会被
    # 静态缓存规则接管、去本地 root 找文件而 404
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Knife4j / springdoc-openapi 接口文档（生产可在后端设置 KNIFE4J_PRODUCTION=true 关闭）
    location ~ ^/(doc\.html|swagger-ui\.html|webjars/|v3/api-docs|swagger-ui/|swagger-resources/|favicon\.ico) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
